            transition: transform .1s ease, filter .15s ease, box-shadow .15s ease;
        }
        .knopka:hover { filter: brightness(1.1); }
        .knopka:active { transform: scale(.96); }
        #knopkaIgrat { background: linear-gradient(180deg, #6ee36e, #2ea32e);
            box-shadow: 0 6px 24px rgba(70,220,90,.5), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.25); }
        .knopkaMagazinaCvet { background: linear-gradient(180deg, #c05ae0, #8a2be2); }
        .knopkaKvestyCvet { background: linear-gradient(180deg, #35d6e8, #0090a8); }
        .knopkaDaily { background: linear-gradient(180deg, #ffb340, #f57c00); }
        .knopkaLeader { background: linear-gradient(180deg, #42a5f5, #1565c0); }
        .knopkaReklama { background: linear-gradient(180deg, #ff5c8a, #d81b60); }
        .knopkaSharCvet { background: linear-gradient(180deg, #9575cd, #5e35b1); }
        .knopka.serya { background: linear-gradient(180deg, #9e9e9e, #616161); }
        .game-hud {
            background: rgba(12,8,5,.55);
                        border: 1px solid rgba(255,255,255,.14);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 16px;
            letter-spacing: .5px;
            text-shadow: 0 2px 4px rgba(0,0,0,.7);
            box-shadow: 0 4px 14px rgba(0,0,0,.35);
        }
        .kartochkaSkina {
            background: rgba(255,255,255,.07);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.10);
                        transition: transform .12s ease;
            padding: 10px 8px;
        }
        .kartochkaSkina:hover { transform: translateY(-3px); }
        .kvestRow { border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); }
        .setka { gap: 10px; }
        .best-score { letter-spacing: 1.5px; }
        * { scrollbar-width: none; -ms-overflow-style: none; }
        html, body, button, canvas { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        html { overscroll-behavior: none; position: fixed; inset: 0; width: 100%; height: 100%; }
        body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
        *::-webkit-scrollbar { width: 0; height: 0; display: none; }
        .scrollBox { max-height: 46vh; overflow-y: auto; width: 100%; padding: 2px; }
        .qcard { display: flex; gap: 10px; align-items: center;
            background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
            border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 10px 12px; margin-bottom: 10px; }
        .qcard.qgot { border-color: #7cfc00; box-shadow: 0 0 14px rgba(124,252,0,.35); }
        .qicon { width: 42px; height: 42px; border-radius: 14px; flex: 0 0 42px;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), rgba(0,0,0,.35));
            display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .coinIcoImg { width: 1.1em; height: 1.1em; vertical-align: -0.2em; }
        .qicon .coinIcoImg, .coinIcoImg.coinBig { width: 26px; height: 26px; vertical-align: middle; }
        .qbody { flex: 1; text-align: left; }
        .qname { font-size: 12px; color: #fff; margin-bottom: 6px; }
        .kvestBar { width: 100%; height: 10px; background: rgba(0,0,0,.45); border-radius: 6px; overflow: hidden; }
        .kvestFill { height: 100%; background: linear-gradient(90deg, #7cfc00, #ffd700); border-radius: 6px; }
        .qright { min-width: 76px; display: flex; justify-content: flex-end; align-items: center; }
        .skincard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: linear-gradient(170deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
            border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 24px 8px 10px;
            transition: transform .12s ease, box-shadow .2s; }
        .skincard:hover { transform: translateY(-3px); }
        .skincard .redkostLabel { position: absolute; top: 6px; right: 6px; }
        .skincard.redk-rare { border-color: #4d94ff; box-shadow: 0 0 12px rgba(70,140,255,.35); }
        .skincard.redk-epic { border-color: #b06dff; box-shadow: 0 0 14px rgba(160,90,255,.4); }
        .skincard.redk-legendary { border-color: #ffd700; box-shadow: 0 0 16px rgba(255,215,0,.5); }
        .skincard.eq { outline: 2px solid #ffd700; }
        .skinimg { width: 64px; height: 64px; border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.22), rgba(0,0,0,.4));
            display: flex; align-items: center; justify-content: center; }
        .skinimg img { height: 52px; object-fit: contain; filter: drop-shadow(2px 4px 6px black); }
        .chipsRow { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
        .chip { font-size: 12px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.18);
            border-radius: 999px; padding: 2px 7px; color: #ddd; }
        .uzNode { position: relative; width: 46px; height: 46px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,.2);
            background: linear-gradient(170deg, rgba(255,255,255,.14), rgba(0,0,0,.3));
            color: #fff; font-family: 'RussoOne', sans-serif; font-size: 15px; cursor: pointer; }
        .uzNode.done { border-color: #7cfc00; box-shadow: 0 0 10px rgba(124,252,0,.3); }
        .uzNode.locked { opacity: .35; cursor: default; }
        .uzStars { position: absolute; bottom: -12px; left: 0; right: 0; font-size: 12px; color: #ffd700; text-align: center; }
        .kartaRow { margin-bottom: 16px; }
        .glavaLbl { font-size: 11px; color: #e8c9a0; letter-spacing: 1px; margin-bottom: 8px; text-align: left; }
        .uzlyRow { display: flex; gap: 8px; justify-content: space-between; }
        .hardChip { font-size: 12px; padding: 8px 12px; min-height: 44px; }
        .verTag { font-size: 10px; color: rgba(255,255,255,.45); letter-spacing: 1px; margin-top: 2px; }
        .topBanner { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 70;
            display: flex; align-items: center; gap: 8px; max-width: min(360px, 92vw);
            padding: 6px 10px; border-radius: 14px;
            background: linear-gradient(165deg, rgba(36,25,17,.92), rgba(14,9,6,.94));
            border: 1px solid rgba(255,255,255,.18); box-shadow: 0 6px 18px rgba(0,0,0,.45); }
        .topBanner.skrytoBanner { display: none; }
        #tbText { font-size: 12px; color: #ffe9b0; flex: 1; text-align: left; }
        #tbBtn { font-size: 11px; padding: 6px 10px; min-height: 32px; }
        #tbClose { background: none; border: none; color: rgba(255,255,255,.55); font-size: 15px; cursor: pointer; padding: 4px; }
        body.bannerOn .game-hud, body.bannerOn #knopkaPauza, body.bannerOn #panelMonet { top: 52px; }
        #veilBlur { display: none !important; position: absolute; inset: 0; background: rgba(8, 5, 3, 0);
            opacity: 0; transition: opacity .25s ease; pointer-events: none; z-index: 150; }
        #veilBlur.pokazan { opacity: 1; }
        #igrovoePole { transition: filter .25s ease; }
        #igrovoePole.zabliur { filter: none; }
        .popup-overlay.skryto {
            display: block !important;
            visibility: hidden;
            pointer-events: none;
            animation: popOut .18s ease both;
            transition: visibility 0s linear .18s;
        }
        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(var(--ms, 1)); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(calc(var(--ms, 1) * .8)); opacity: 0; }
        }
        #panelMonet.coinpulse { animation: coinPulse .3s ease; }
        @keyframes coinPulse {
            0% { transform: scale(1); }
            40% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        .popup-overlay { transform: translate(-50%, -50%) scale(var(--ms, 1)); }
        .popup-overlay:not(.skryto) { animation: popSpring .42s cubic-bezier(.34, 1.56, .64, 1); }
        @keyframes popSpring {
            0% { transform: translate(-50%, -50%) scale(calc(var(--ms, 1) * .72)); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(var(--ms, 1)); opacity: 1; }
        }
        .ekran.main-menu:not(.skryto) { animation: menuIn .32s ease; }
        .ekran.main-menu { max-height: 94vh; overflow-y: auto; }
        .popup-overlay { overflow-y: auto; }
        @keyframes menuIn {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .chestRow { display: flex; gap: 8px; width: 100%; margin-bottom: 4px; }
        .chestFreeBtn { margin-top: 4px; font-size: 11px; min-height: 30px; padding: 4px 6px; letter-spacing: 0; }
        .chestCard { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
            background: linear-gradient(170deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
            border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 8px 6px; }
        .chestImg { width: 58px; height: 58px; object-fit: contain; filter: drop-shadow(2px 3px 4px black); }
        .chestImg.cs { filter: grayscale(1) brightness(1.35) sepia(.3) hue-rotate(180deg) drop-shadow(2px 3px 4px black); }
        .chestImg.cg { filter: sepia(.7) saturate(2.2) brightness(1.1) hue-rotate(-8deg) drop-shadow(0 0 8px rgba(255,200,60,.6)); }
        .chestName { font-family: 'RussoOne', sans-serif; font-size: 9px; color: #ffd76a; letter-spacing: .5px; text-align: center; }
        .chestDesc { font-size: 12px; color: #bbb; text-align: center; line-height: 1.3; }
        .chestBtn { font-size: 12px; padding: 8px 10px; min-height: 44px; }
        .rl-mythic { background: linear-gradient(90deg, #d50000, #6a1b9a); color: #ffd7d7; }
        .skincard.redk-mythic { border-color: #ff5252; box-shadow: 0 0 18px rgba(255,60,120,.5); }
        .kartochkaSkina.redk-mythic { border: 1px solid #ff5252; box-shadow: 0 0 18px rgba(255,60,120,.5); }
        .knopkaKartaCvet { background: linear-gradient(180deg, #8d6e63, #4e342e); }
        .knopkaAchCvet { background: linear-gradient(180deg, #ffd54f, #f57f17); }
        @media (max-width: 480px) {
            .ekran, .popup-overlay { padding: 14px 12px; border-radius: 20px; gap: 9px; }
            .knopka { padding: 11px 14px; font-size: 13px; letter-spacing: .8px; }
            .game-hud { font-size: 13px; padding: 5px 11px; }
        }

        .ekran, .popup-overlay {
            border: 2px solid transparent;
            border-radius: 28px;
            background:
                linear-gradient(165deg, rgba(36,25,17,.90), rgba(14,9,6,.94)) padding-box,
                linear-gradient(120deg, #ffd76a, #ff7043, #c05ae0, #35d6e8, #ffd76a) border-box;
            background-size: auto, 300% 300%;
            animation: uiFade .25s ease, borderFlow 9s ease-in-out infinite;
        }
        @keyframes borderFlow {
            0% { background-position: 0% 50%, 0% 50%; }
            50% { background-position: 0% 50%, 100% 50%; }
            100% { background-position: 0% 50%, 0% 50%; }
        }
        .knopka {
            position: relative;
            overflow: hidden;
            font-family: 'RussoOne', 'Segoe UI', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 1.6px;
            border-radius: 999px;
        }
        .knopka::after {
            content: '';
            position: absolute;
            top: 0; left: -70%;
            width: 45%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.4), transparent);
            transform: skewX(-20deg);
            animation: shine 4.2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes shine { 0%, 55% { left: -70%; } 100% { left: 135%; } }
        .ekran h1, .ekran h2, .popup-overlay h1, .popup-overlay h2,
        .game-hud, .best-score, .nazvanieSkina, .preloader-title {
            font-family: 'RussoOne', 'Segoe UI', system-ui, sans-serif;
            font-weight: 400;
        }
        .game-hud { font-size: 15px; letter-spacing: 1px; }
        .preloader-title {
            background: linear-gradient(180deg, #fff, #ffd76a 60%, #ff9d3c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }
        .kvestNazv { font-family: 'Segoe UI', system-ui, sans-serif; }

<script>
(function () {
    'use strict';

    // =========================================================
    // ОПРЕДЕЛЕНИЕ ОКРУЖЕНИЯ

    function isInsideVk() {
        try {
            var params = new URLSearchParams(window.location.search);
            if (params.has('vk_app_id')) {
                return true;
            }
            if (params.has('vk_user_id')) {
                return true;
            }
            var ref = document.referrer || '';
            if (ref.indexOf('vk.com') !== -1) {
                return true;
            }
            if (ref.indexOf('vk.ru') !== -1) {
                return true;
            }
            return false;
        } catch (e) {
            return false;
        }
    }

    function adToast() {
        var ts = document.getElementById('toastShar');

        ts.innerText = currentLang === 'ru' ? 'Видео недоступно в вашем регионе / включён адблок' : 'Video unavailable in your region / adblock on';
        ts.classList.add('pokazat');

    function pokazatDemoVideo(onDone) {
        var ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-family:Arial,sans-serif;';
        ov.innerHTML = '<div style="font-size:15px;opacity:.75;">' + (currentLang === 'ru' ? 'ДЕМО-РЕЖИМ: реклама подключится на площадках' : 'DEMO MODE: ads enable on platforms') + '</div>' +
            '<div id="demoAdCount" style="font-size:64px;font-weight:bold;">3</div>' +
            '<div style="width:220px;height:8px;background:#333;border-radius:6px;overflow:hidden;"><div id="demoAdBar" style="height:100%;width:100%;background:linear-gradient(90deg,#7cfc00,#ffd700);transition:width 3s linear;"></div></div>';
        document.body.appendChild(ov);
        requestAnimationFrame(function () {
            var bar = document.getElementById('demoAdBar');
            if (bar) bar.style.width = '0%';
        });
        var n = 3;
        var iv = setInterval(function () {
            n--;
            var c = document.getElementById('demoAdCount');
            if (c) c.innerText = n > 0 ? n : '✓';
            if (n <= 0) {
                clearInterval(iv);
                setTimeout(function () {
                    ov.remove();

    window.addEventListener('pagehide', function () {
        if (PlatformAdapter.platform === 'gamepush' && PlatformAdapter.sdk) {
            var gp = PlatformAdapter.sdk;
            try {
                if (typeof gp.gameStop === 'function') { gp.gameStop(); gpDebug('gameStop'); }
            } catch (e) {}
        }
    });

    var gpEventsHooked = false;
    function hookGpEvents() {
        if (gpEventsHooked || PlatformAdapter.platform !== 'gamepush' || !PlatformAdapter.sdk) return;
        var gp = PlatformAdapter.sdk;
        gpEventsHooked = true;
        try {
            if (gp.on) {
                gp.on('pause', function () {
                    gpGameplay(false);
                    var bgm = document.getElementById('bgMusic');
                    if (bgm) bgm.pause();
                    if (sostoyanieIgry === 'PLAY' && !pauzaAktivna) otkrytPauzu();
                });
                gp.on('resume', function () {});
            }
            if (gp.sounds && gp.sounds.on) {
                gp.sounds.on('mute', function () { isMuted = true; updateVolumeUI(); });
                gp.sounds.on('unmute', function () { isMuted = false; updateVolumeUI(); });
            }
        } catch (e) {}
    }
    function gpDebug(msg) {
        try {
            if (window.location.search.indexOf('gpdebug') !== -1) console.log('[GP] ' + msg);
        } catch (e) {}
    }
    function gpGameplay(start) {
        if (PlatformAdapter.platform !== 'gamepush' || !PlatformAdapter.sdk) return;
        var gp = PlatformAdapter.sdk;
        try {
            if (start) {
                if (typeof gp.gameplayStart === 'function') gp.gameplayStart();
                else if (gp.gameplay && typeof gp.gameplay.start === 'function') gp.gameplay.start();
                gpDebug('gameplayStart');
            } else {
                if (typeof gp.gameplayStop === 'function') gp.gameplayStop();
                else if (gp.gameplay && typeof gp.gameplay.stop === 'function') gp.gameplay.stop();
                gpDebug('gameplayStop');
            }
        } catch (e) {}
    }
    var gpPrevState = 'MENU';

    function gpStateWatch() {
        if (sostoyanieIgry !== gpPrevState) {
            gpGameplay(sostoyanieIgry === 'PLAY');
            gpPrevState = sostoyanieIgry;
        }
        if (!gpEventsHooked && PlatformAdapter.platform === 'gamepush') hookGpEvents();
    }

    function detectGamePush() {
        if (typeof window.GamePush !== 'undefined' && window.GamePush) {
            return window.GamePush;
        }
        if (typeof window.GP !== 'undefined' && window.GP) {
            return window.GP;
        }
        return null;
    }

    function loadVkBridge(callback) {
        if (!isInsideVk()) {
            callback(false);
            return;
        }
        var urls = [
            'https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js',
            'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge/dist/browser.min.js'
        ];
        var idx = 0;
        var done = false;
        function tryNext() {
            if (done) {
                return;
            }
            if (idx >= urls.length) {
                done = true;
                callback(false);
                return;
            }
            var s = document.createElement('script');
            s.src = urls[idx];
            s.async = true;
            var to = setTimeout(function () {
                s.onload = null;
                s.onerror = null;
                idx++;
                tryNext();
            }, 4000);
            s.onload = function () {
                clearTimeout(to);
                if (!done) {
                    done = true;
                    callback(true);
                }
            };
            s.onerror = function () {
                clearTimeout(to);
                idx++;
                tryNext();
            };
            document.head.appendChild(s);
        }
        tryNext();
    }

    function adLog(msg) {
        console.log('[AD]', msg);
    }

    // =========================================================
    // ПРОЦЕДУРНЫЕ СПРАЙТЫ НОВЫХ НОЖЕЙ (без PNG-файлов)
    // =========================================================
    function sozdatSpriteNozha(cfg) {
        var c = document.createElement('canvas');
        c.width = 64;
        c.height = 192;
        var g = c.getContext('2d');

        g.clearRect(0, 0, 64, 192);

        if (cfg.glow) {
            g.shadowColor = cfg.glow;
            g.shadowBlur = 12;
        }

        g.fillStyle = cfg.handle;
        g.beginPath();
        g.roundRect(26, 120, 12, 62, 5);
        g.fill();

        g.fillStyle = cfg.guard;
        g.fillRect(18, 112, 28, 10);

        g.fillStyle = cfg.blade;
        g.beginPath();

        if (cfg.shape === 'wide') {
            g.moveTo(20, 112);
            g.lineTo(20, 30);
            g.lineTo(44, 30);
            g.lineTo(44, 112);
            g.closePath();
        } else if (cfg.shape === 'curved') {
            g.moveTo(28, 112);
            g.quadraticCurveTo(18, 60, 30, 14);
            g.quadraticCurveTo(40, 60, 36, 112);
            g.closePath();
        } else if (cfg.shape === 'trident') {
            g.moveTo(24, 112);
            g.lineTo(24, 40);
            g.lineTo(20, 20);
            g.lineTo(26, 40);
            g.lineTo(30, 40);
            g.lineTo(32, 12);
            g.lineTo(34, 40);
            g.lineTo(38, 40);
            g.lineTo(44, 20);
            g.lineTo(40, 40);
            g.lineTo(40, 112);
            g.closePath();
        } else if (cfg.shape === 'dart') {
            g.moveTo(30, 112);
            g.lineTo(28, 50);
            g.lineTo(32, 10);
            g.lineTo(36, 50);
            g.lineTo(34, 112);
            g.closePath();
        } else if (cfg.shape === 'scythe') {
            g.moveTo(28, 112);
            g.lineTo(28, 40);
            g.quadraticCurveTo(30, 16, 52, 20);
            g.quadraticCurveTo(36, 30, 36, 44);
            g.lineTo(36, 112);
            g.closePath();
        } else {
            g.moveTo(26, 112);
            g.lineTo(26, 34);
            g.lineTo(32, 12);
            g.lineTo(38, 34);
            g.lineTo(38, 112);
            g.closePath();
        }
        g.fill();

        g.shadowBlur = 0;
        g.fillStyle = 'rgba(255,255,255,0.35)';
        g.fillRect(30, 30, 3, 70);

        return c.toDataURL('image/png');
    }

    var NOVYE_NOZHI_DEF = [
        {
            id: 'fork',
            tip: { shape: 'trident', blade: '#C0C0C0', handle: '#8B4513', guard: '#A9A9A9', glow: null }

    // =========================================================
    // PLATFORM ADAPTER (web / vk / gamepush)
    // =========================================================
    var PlatformAdapter = {
        platform: 'web',
        sdk: null,
        vkBridge: null,
        sessionStartTime: Date.now(),
        lastInterstitialTime: 0,
        userId: null,

        init: function () {
            var self = this;
            return new Promise(function (resolve) {
                var gp = detectGamePush();
                if (gp) {
                    self.platform = 'gamepush';
                    self.sdk = gp;
                    adLog('GamePush detected');
                    self._gpSignalReady();
                    hookGpEvents();
                    resolve();
                    return;
                }

                if (isInsideVk() && typeof vkBridge !== 'undefined' && vkBridge) {
                    vkBridge.send('VKWebAppInit').then(function () {
                        self.platform = 'vk';
                        self.vkBridge = vkBridge;
                        adLog('VK Bridge initialized');
                        return vkBridge.send('VKWebAppGetUserInfo');
                    }).then(function (user) {
                        if (user) {
                            self.userId = user.id;
                            if (user.first_name) playerName = String(user.first_name);
                        }
                    }).catch(function (e) {
                        adLog('VK init warning: ' + e);
                        if (self.platform !== 'vk') {
                            self.platform = 'vk';
                            self.vkBridge = vkBridge;
                        }
                    });

                    setTimeout(function () {
                        if (self.vkBridge && self.vkBridge.subscribe) {
                            self.vkBridge.subscribe(function (event) {
                                if (event.detail && event.detail.type === 'VKWebAppViewHide') {
                                    pauseGameForAd();
                                }
                                if (event.detail && event.detail.type === 'VKWebAppViewRestore') {
                                    resumeGameAfterAd();
                                }
                            });
                        }
                        resolve();
                    }, 100);
                    return;
                }

                adLog('Web mode');
                self.platform = 'web';
                resolve();
            });
        },

        _gpSignalReady: function () {
            var gp = this.sdk;
            if (!gp) {
                return;
            }
            try {
                if (gp.games && typeof gp.games.ready === 'function') {
                    gp.games.ready();
                }
                if (typeof gp.gameStart === 'function') {
                    gp.gameStart();
                } else if (typeof gp.ready === 'function') {
                    gp.ready();
                } else if (typeof gp.start === 'function') {
                    gp.start();
                }
            } catch (e) {
                adLog('GP ready warn: ' + e);
            }
        },

        signalReady: function () {
            if (this.platform === 'gamepush') {
                this._gpSignalReady();
                return;
            }
            if (this.platform === 'vk' && this.vkBridge) {
                try {
                    this.vkBridge.send('VKWebAppSetViewSettings', {
                        status_bar_style: 'dark',
                        action_bar_color: '#000000'
                    }).catch(function () {});
                } catch (e) {}
            }
        },

        _gpCall: function (names, args) {
            var gp = this.sdk;
            if (!gp) {
                return null;
            }
            for (var i = 0; i < names.length; i++) {
                var path = names[i].split('.');
                var obj = gp;
                var ok = true;
                for (var j = 0; j < path.length - 1; j++) {
                    if (!obj[path[j]]) {
                        ok = false;
                        break;
                    }
                    obj = obj[path[j]];
                }
                var fnName = path[path.length - 1];
                if (ok && obj && typeof obj[fnName] === 'function') {
                    try {
                        return obj[fnName].apply(obj, args || []);
                    } catch (e) {
                        return null;
                    }
                }
            }
            return null;
        },

        showPreroll: function (onDone) {
            var self = this;
            if (this.platform === 'gamepush') {
                try {
                    if (sessionStorage.getItem('gp_pre_shown')) { if (onDone) onDone(); return; }
                    sessionStorage.setItem('gp_pre_shown', '1');
                } catch (e) {}
                var r = this._gpCall([
                    'ads.showPreloader',
                    'showPreloader',
                    'ads.showPreload',
                    'showPreload',
                    'ads.preload',
                    'preload'
                ], []);
                if (r && typeof r.then === 'function') {
                    r.then(function () { if (onDone) onDone(); }).catch(function () { if (onDone) onDone(); });
                } else {
                    if (onDone) onDone();
                }
                adLog('GamePush preroll requested');
                return;
            }
            if (onDone) {
                onDone();
            }
        },

        showInterstitial: function (onOpen, onClose, onError) {
            var self = this;
            var now = Date.now();
            var allowed = (now - this.sessionStartTime >= 120000) &&
                (now - this.lastInterstitialTime >= 180000);
            if (!allowed) {
                if (onClose) onClose();
                return;
            }

            if (this.platform === 'gamepush') {
                if (onOpen) onOpen();
                var r = this._gpCall([
                    'ads.showInterstitial',
                    'showInterstitial',
                    'ads.show',
                    'showAd'
                ], []);
                this.lastInterstitialTime = now;
                if (r && typeof r.then === 'function') {
                    r.then(function () { if (onClose) onClose(); }).catch(function () { if (onClose) onClose(); });
                } else {
                    if (onClose) onClose();

            if (this.platform === 'vk' && this.vkBridge) {
                if (onOpen) onOpen();
                this.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' })
                    .then(function () {
                        self.lastInterstitialTime = Date.now();
                        if (onClose) onClose();
                        self.preloadAds();
                    })
                    .catch(function (e) {
                        adLog('VK interstitial err: ' + e);

        showRewarded: function (onOpen, onRewarded, onClose, onError) {
            var self = this;

            if (this.platform === 'web' || !this.sdk && !this.vkBridge) {
                adLog('Rewarded web fallback');
                if (onOpen) onOpen();
                pokazatDemoVideo(function () {
                    if (onRewarded) onRewarded();
                    if (onClose) onClose();
                });
                return;
            }

            if (this.platform === 'gamepush') {
                if (onOpen) onOpen();
                var granted = false;
                var cbs = {
                    onReward: function () { granted = true; if (onRewarded) onRewarded(); },
                    onClose: function () { if (onClose) onClose(); },
                    onError: function () { if (onError) onError(); if (onClose) onClose(); }
                };
                var answered = false;
                var fireError = function () {
                    if (answered) return;
                    answered = true;
                    adToast();
                    pokazatDemoVideo(function () {
                        if (!granted && onRewarded) onRewarded();
                        if (onClose) onClose();
                    });
                };
                var grant = function () { if (!granted) { granted = true; if (onRewarded) onRewarded(); } };
                try {
                    if (self.sdk.ads && self.sdk.ads.on) {
                        self.sdk.ads.on('reward', grant);
                        self.sdk.ads.on('close', function () { answered = true; if (onClose) onClose(); });
                        self.sdk.ads.on('error', function () { fireError(); });
                    }
                } catch (e) {}
                var wrap = {
                    onReward: grant,
                    onRewarded: grant,
                    onSuccess: grant,
                    onClose: function () { answered = true; if (onClose) onClose(); },
                    onError: fireError,
                    onFail: fireError
                };
                try {
                    if (self.sdk.ads && self.sdk.ads.on) {
                        self.sdk.ads.on('rewarded:reward', grant);
                        self.sdk.ads.on('rewarded:close', function () { answered = true; if (onClose) onClose(); });
                    }
                } catch (e) {}
                var r = this._gpCall([
                    'ads.showRewardedVideo',
                    'showRewardedVideo',
                    'ads.showRewarded',
                    'showRewarded'
                ], [wrap]);
                if (r && typeof r.then === 'function') {
                    r.then(function (success) {
                        if (!answered) {
                            answered = true;
                            if (success !== false) grant();
                            if (onClose) onClose();
                        }
                    }).catch(fireError);
                }
                setTimeout(function () {
                    if (answered) return;
                    var r2 = self._gpCall(['ads.showRewarded', 'showRewarded'], [wrap]);
                    if (r2 && typeof r2.then === 'function') r2.catch(function () { fireError(); });
                    setTimeout(function () { if (!answered) fireError(); }, 8000);
                }, 12000);
                return;
            }

            if (this.platform === 'vk' && this.vkBridge) {
                if (onOpen) onOpen();
                this.vkBridge.send('VKWebAppCheckNativeAds', { ad_format: 'reward' })
                    .then(function (checkData) {
                        if (checkData && checkData.result) {
                            self._vkDoShowRewarded(onRewarded, onClose, onError);
                        } else {
                            adLog('VK reward not ready → grant without ad');
                            if (onRewarded) onRewarded();
                            if (onClose) onClose();
                        }
                    })
                    .catch(function () {
                        if (onRewarded) onRewarded();
                        if (onClose) onClose();
                    });
                return;
            }

            if (onRewarded) onRewarded();
            if (onClose) onClose();
        },

        _vkDoShowRewarded: function (onRewarded, onClose, onError) {
            var self = this;
            var settled = false;
            var finishOk = function () {
                if (settled) return;
                settled = true;
                if (onRewarded) onRewarded();
                if (onClose) onClose();
                self.preloadAds();
            };
            var finishFail = function (reason) {
                if (settled) return;
                settled = true;
                adLog('VK reward fail: ' + reason);
                if (onError) onError();
                if (onClose) onClose();
            };
            var hang = setTimeout(function () { finishFail('hang'); }, 45000);
            this.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' })
                .then(function (data) {
                    clearTimeout(hang);
                    if (data && data.result) finishOk();
                    else finishFail('no-result');
                })
                .catch(function (e) {
                    clearTimeout(hang);
                    finishFail(e && e.message ? e.message : 'reject');
                });
        },

        preloadAds: function () {
            if (this.platform === 'vk' && this.vkBridge) {
                this.vkBridge.send('VKWebAppCheckNativeAds', { ad_format: 'interstitial' }).catch(function () {});
                this.vkBridge.send('VKWebAppCheckNativeAds', { ad_format: 'reward' }).catch(function () {});

            if (this.platform === 'gamepush') {

        saveData: function (data) {
            var self = this;
            try {
                localStorage.setItem('fs_save', JSON.stringify(data));
            } catch (e) {}

            if (this.platform === 'vk' && this.vkBridge) {
                this.vkBridge.send('VKWebAppStorageSet', {
                    key: 'fs_save',
                    value: JSON.stringify(data)
                }).catch(function () {});
            }

            if (this.platform === 'gamepush') {
                gpDebug('save -> player.set+sync');
                if (this.sdk && this.sdk.player && this.sdk.player.set) {
                    try {
                        this.sdk.player.set('fs_save', JSON.stringify(data));
                        if (this.sdk.player.sync) this.sdk.player.sync();
                    } catch (e) {}
                }
            }
        },

        loadData: function () {
            var self = this;
            return new Promise(function (resolve) {
                var fallback = function () {
                    try {
                        var raw = localStorage.getItem('fs_save');
                        resolve(raw ? JSON.parse(raw) : null);
                    } catch (e) {
                        resolve(null);
                    }
                };

                if (self.platform === 'vk' && self.vkBridge) {
                    self.vkBridge.send('VKWebAppStorageGet', { keys: ['fs_save'] })
                        .then(function (res) {
                            if (res && res.keys && res.keys.length && res.keys[0].value) {
                                try {
                                    resolve(JSON.parse(res.keys[0].value));
                                    return;
                                } catch (e) {}
                            }
                            fallback();
                        })
                        .catch(fallback);
                    return;
                }

                if (self.platform === 'gamepush') {
                    gpDebug('load -> player.get(fs_save)');
                    var done = function () {
                        try {
                            var raw = self.sdk.player.get('fs_save');
                            if (raw) {
                                resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
                                return;
                            }
                        } catch (e) {}
                        fallback();
                    };
                    if (self.sdk && self.sdk.player && self.sdk.player.get) {
                        if (self.sdk.player.ready && self.sdk.player.ready.then) {
                            self.sdk.player.ready.then(done).catch(function () { fallback(); });
                        } else done();
                        return;
                    }
                    fallback();
                    return;
                }

                fallback();
            });
        },

        leaderSubmit: function (score) {
            if (this.platform === 'gamepush') {
                this._gpCall([
                    'leaders.submit',
                    'leaderboards.submit',
                    'submitScore',
                    'leaders.add'
                ], [score]);
                adLog('GP leader submit: ' + score);
            }
            // VK: VKWebAppShowLeaderBoard из сабмита УДАЛЁН — он лишь показывает пустой
            // нативный борд (запись требует серверного Scores API). «ТОП» открывает localLeaders.
        },

        leaderShow: function () {
            if (this.platform === 'gamepush') {
                var r = this._gpCall([
                    'leaders.show',
                    'leaderboards.show',
                    'showLeaderboard'
                ], []);
                if (r) {

                }
            }
            // В VK нет нативного метода лидерборда в Bridge — всегда показываем свой экран.
            return false;
        },

        getLanguage: function () {
            try {
                if (PlatformAdapter.platform === 'gamepush' && PlatformAdapter.sdk && PlatformAdapter.sdk.language) {
                    var gl = PlatformAdapter.sdk.language;
                    if (gl === 'ru' || gl === 'en') return gl;
                }
            } catch (e) {}
            try {
                var saved = localStorage.getItem('fs_lang');
                if (saved === 'ru' || saved === 'en') {
                    return saved;
                }
                var params = new URLSearchParams(window.location.search);
                var vkLang = params.get('vk_language') || params.get('language');
                if (vkLang === 'ru') return 'ru';
                if (vkLang === 'en') return 'en';
                if (this.platform === 'gamepush') {
                    return 'en';
                }
                var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                if (nav.indexOf('ru') === 0) return 'ru';
                return 'en';
            } catch (e) {
                return 'en';
            }
        }
    };

            uiTekstNozhei.textContent = t('knives') + ' ' + ostalosNozhei;
            var rs = document.getElementById('uiRunStats');
            if (rs && sostoyanieIgry === 'GAMEOVER') {
                var doSkina = skolkoDoNovogoSkina();
                rs.innerHTML = t('stats') + ': ' + runYabloki + ' 🪙 (' + runMonetyLocal + ')' +
                    (doSkina > 0 ? '<br>' + t('toSkin') + ': ' + doSkina + ' 🪙' : '');
            }
            var kv = document.getElementById('knopkaVoskresheniya');
            if (kv && sostoyanieIgry === 'GAMEOVER') kv.style.display = (hardkor || vozrozhdeniyaNaUrovne >= 2) ? 'none' : '';
            var krx2 = document.getElementById('knopkaRunX2');
            if (!krx2 && kv && kv.parentNode) {
                krx2 = document.createElement('button');
                krx2.id = 'knopkaRunX2';
                krx2.className = 'knopka knopkaReklama';
                krx2.onclick = function () {
                    if (runX2Given || sostoyanieIgry !== 'GAMEOVER') return;
                    PlatformAdapter.showRewarded(
                        pauseGameForAd,
                        function () {
                            if (runX2Given || sostoyanieIgry !== 'GAMEOVER') return;
                            runX2Given = true;
                            dobavitMonety(runMonetyLocal); // base уже начислен — это и есть ×2
                            playSnd('win');
                            var b2 = document.getElementById('knopkaRunX2');
                            if (b2) b2.style.display = 'none';
                            var rs2 = document.getElementById('uiRunStats');
                            if (rs2) rs2.innerHTML = t('stats') + ': ' + runYabloki + ' 🪙 (' + (runMonetyLocal * 2) + ')';
                        },
                        resumeGameAfterAd,
                        function () {
                            resumeGameAfterAd();
                            var b3 = document.getElementById('knopkaRunX2');
                            if (b3 && !runX2Given) b3.style.display = 'none';
                        }
                    );
                };
                kv.parentNode.insertBefore(krx2, kv.nextSibling);
            }
            if (krx2) {
                krx2.innerText = t('runX2');
                krx2.style.display = (!hardkor && !runX2Given && runMonetyLocal > 0 && sostoyanieIgry === 'GAMEOVER') ? '' : 'none';
            }
            uiTekstLevel.style.color = eb ? '#FF4444' : '#FFFFFF';
        } else {
            uiPanelLevel.classList.add('skryto');
            uiPanelNozhei.classList.add('skryto');
        }
        if (panelPauza) {
            if (sostoyanieIgry === 'PLAY') panelPauza.classList.remove('skryto');
            else panelPauza.classList.add('skryto');
        }
    }

    function nastroikaEkrana() {
        var winWidth, winHeight;
        if (window.visualViewport) {
            winWidth = window.visualViewport.width;
            winHeight = window.visualViewport.height;
        } else {
            winWidth = window.innerWidth;
            winHeight = window.innerHeight;
        }
        winWidth = Math.max(0, winWidth - 20);
        winHeight = Math.max(0, winHeight - 20);
        var aspectRatio = 9 / 16;
        var finalWidth, finalHeight;
        if (winWidth / winHeight > aspectRatio) {
            finalHeight = winHeight;
            finalWidth = finalHeight * aspectRatio;
        } else {
            finalWidth = winWidth;
            finalHeight = finalWidth / aspectRatio;
        }
        var container = document.getElementById('gameContainer');
        container.style.width = finalWidth + 'px';
        container.style.height = finalHeight + 'px';
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        holst.width = Math.floor(finalWidth * dpr);
        holst.height = Math.floor(finalHeight * dpr);
        kist.setTransform(1, 0, 0, 1, 0, 0);
        kist.scale(dpr, dpr);
        globalScale = finalWidth / GAME_BASE_WIDTH;

        var uiScale = Math.max(0.5, Math.min(globalScale, 1.2));
        [uiPanelLevel, uiPanelNozhei].forEach(function (el) {
            if (el) {
                el.style.fontSize = Math.max(10, 24 * uiScale) + 'px';
                var sh = Math.max(1, 2 * uiScale);
                el.style.textShadow = sh + 'px ' + sh + 'px ' + (sh * 2) + 'px #000000';
            }
        });
        if (uiPanelMonet) {
            uiPanelMonet.style.fontSize = Math.max(12, 18 * uiScale) + 'px';
        }

        startNozhY = 580;
        if (!nozh.letit) {
            nozh.y = startNozhY;
            nozh.x = 200;
        }
        arbuz.x = 200;
        arbuz.bazi_Y = 230;
        if (sostoyanieIgry === 'MENU' || sostoyanieIgry === 'GAMEOVER') arbuz.y = arbuz.bazi_Y;

        var slider = document.getElementById('panelZvuka');
        if (slider) {
            var s1 = Math.min(globalScale, 0.8);
            slider.style.transform = 'translate(' + (15 * s1) + 'px, ' + (50 * s1) + 'px) scale(' + s1 + ')';
        }
        var monet = document.getElementById('panelMonet');
        if (monet) {
            var s2 = Math.min(globalScale, 0.8);
            monet.style.transform = 'translate(' + (-15 * s2) + 'px, ' + (50 * s2) + 'px) scale(' + s2 + ')';
        }
        if (panelYazyka) {
            var s3 = Math.max(0.6, Math.min(globalScale, 1));
            panelYazyka.style.transform = 'scale(' + s3 + ')';
        }

        updateHUD();
        updateUI();
        scaleMenus();
    }

    function forceResize() {
        requestAnimationFrame(function () { nastroikaEkrana(); });
    }

            if (data.dailyStreak !== undefined) dailyStreak = data.dailyStreak;
            if (data.leaders) localLeaders = data.leaders;
            if (typeof data.playerName === 'string' && data.playerName) playerName = data.playerName;
            localLeaders = localLeaders.map(function (r) { return typeof r === 'number' ? { s: r, d: 0, n: '' } : r; });
            if (data.kvesty) kvesty = data.kvesty;
            if (data.zvezdy) zvezdy = data.zvezdy;
            if (data.stat) stat = data.stat;
            if (data.hardkor !== undefined) hardkor = data.hardkor;

    var audioContext = null;
    var isAudioUnlocked = false;
    var audioBuffers = {};
    var audioFileList = {
        throw: 'throw.mp3',
        fail: 'fail.mp3',
        apple: 'apple.mp3',
        win: 'win.mp3',
        chest: 'chest.mp3',
        uiopen: 'uiopen.mp3',
        uiclose: 'uiclose.mp3',
        uitick: 'uitick.mp3'
    };

    function initAudio() {
        if (audioContext) return true;
        try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return false;
            audioContext = new AudioCtx();
            masterGain = audioContext.createGain();
            masterGain.gain.value = isMuted ? 0 : currentVolume;
            masterGain.connect(audioContext.destination);
            return true;
        } catch (e) {
            return false;
        }
    }

    function unlockAudio() {
        var bgm0 = document.getElementById('bgMusic');
        if (bgm0) {
            bgm0.volume = Math.max(0, Math.min(1, (isMuted ? 0 : currentVolume) * 0.45));
            if (!isMuted) bgm0.play().catch(function () {});
        }
        if (isAudioUnlocked) return;
        if (initAudio() && audioContext.state === 'suspended') {
            audioContext.resume().then(function () { isAudioUnlocked = true; }).catch(function () {});
        }
        isAudioUnlocked = true;
    }
    document.addEventListener('click', unlockAudio, { once: true, passive: true });
    document.addEventListener('click', function (e) {
        if (e.target && e.target.closest && e.target.closest('.knopka')) playSnd('uitick');
    }, true);
    document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
    document.addEventListener('keydown', unlockAudio, { once: true, passive: true });

    function loadAudioFiles() {
        var keys = Object.keys(audioFileList);
        if (!initAudio()) {
            for (var i = 0; i < keys.length; i++) assetLoaded();
            return;
        }
        keys.forEach(function (key) {
            fetch(audioFileList[key])
                .then(function (res) { return res.ok ? res.arrayBuffer() : Promise.reject(new Error('404')); })
                .then(function (buf) { return audioContext.decodeAudioData(buf); })
                .then(function (dec) {
                    audioBuffers[key] = dec;
                    assetLoaded();
                })
                .catch(function () {
                    assetLoaded();
                });
        });
    }

    function playSnd(name) {
        if (isMuted || currentVolume === 0 || !audioContext || !audioBuffers[name]) return;
        try {
            var src = audioContext.createBufferSource();
            src.buffer = audioBuffers[name];
            var gn = audioContext.createGain();
            gn.gain.value = currentVolume;
            src.connect(gn);
            gn.connect(masterGain);
            src.start(0);
        } catch (e) {}
    }

    function updateVolumeUI() {
        var v = isMuted ? 0 : currentVolume;
        if (masterGain) masterGain.gain.value = v;
        var bgm = document.getElementById('bgMusic');
        if (bgm) {
            bgm.volume = Math.max(0, Math.min(1, v * 0.45));
            if (v === 0) bgm.pause();
            else bgm.play().catch(function () {});
        }
        if (knopkaZvuka) knopkaZvuka.innerText = v === 0 ? '🔇' : '🔊';
        if (polzunokZvuka) polzunokZvuka.value = v;
    }

    if (polzunokZvuka) {
        polzunokZvuka.addEventListener('input', function (e) {
            currentVolume = parseFloat(e.target.value);
            isMuted = currentVolume === 0;
            saveData();
            updateVolumeUI();
        });
    }
    if (knopkaZvuka) {
        knopkaZvuka.onclick = function () {
            isMuted = !isMuted;
            if (!isMuted && currentVolume === 0) currentVolume = 0.4;
            saveData();
            updateVolumeUI();
        };
    }

    function zapuskUrovnya(n) {
        sbrosIgry();

        if (n % 5 === 0) bn++;
        if (bn > 7) bn = 7;
        nozhiDlyaPobedy = bn;

        sozdatYablokiIBronyu();
        var ns = 0.03 + (n * 0.002);

        skorostArbuza = ns * SPEED_MULTIPLIER * (Math.random() > 0.5 ? 1 : -1);

    function segodnyaData() {
        var d = new Date();
        var m = (d.getMonth() + 1);
        var day = d.getDate();
        return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
    }

    function dailyDostupna() {
        return dailyLastDate !== segodnyaData();
    }

    function dailySumma() {
        var base = 3 + dailyStreak;
        if (base > 10) base = 10;
        return base;
    }

    function obnovitDailyKnopku() {
        if (!knopkaDaily) return;
        if (dailyDostupna()) {
            knopkaDaily.innerText = t('daily') + ' ✅';

            knopkaDaily.innerText = t('daily');

        if (!dailyDostupna()) return;
        var streakEl = document.getElementById('ui_dailyStreak');
        var amountEl = document.getElementById('ui_dailyAmount');
        if (streakEl) streakEl.innerText = t('dailyStreak') + ' ' + (dailyStreak + 1);
        if (amountEl) amountEl.innerHTML = '+' + dailySumma() + ' ' + coinIco();
        if (uiGlavnoeMenu) uiGlavnoeMenu.classList.add('skryto');
        if (ekranDaily) ekranDaily.classList.remove('skryto');
    }

    function zabratDaily(mult) {
        var sum = dailySumma() * mult;
        var today = segodnyaData();
        var yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        var ym = yesterday.getMonth() + 1;
        var yd = yesterday.getDate();
        var yStr = yesterday.getFullYear() + '-' + (ym < 10 ? '0' + ym : ym) + '-' + (yd < 10 ? '0' + yd : yd);
        if (dailyLastDate === yStr) dailyStreak++;
        else dailyStreak = 1;
        dailyLastDate = today;
        monety += sum;
        updateUI();
        saveData();
        obnovitDailyKnopku();
        if (ekranDaily) ekranDaily.classList.add('skryto');
        if (uiGlavnoeMenu) uiGlavnoeMenu.classList.remove('skryto');
        if (uiGlavnoeMenu) uiGlavnoeMenu.classList.remove('skryto');
        playSnd('win');

    function chestRoll(n) {
        var cost = n === 1 ? 6 : (n === 2 ? 15 : 40);
        var skinChance = n === 1 ? 0.15 : (n === 2 ? 0.30 : 0.45);
        if (Math.random() < skinChance) {
            var poolRars = n === 1 ? ['common', 'rare'] : (n === 2 ? ['rare', 'epic'] : ['epic', 'legendary', 'mythic']);
            var pool = vseSkins.filter(function (s) { return poolRars.indexOf(s.redkost) !== -1 && kuplyennyeSkins.indexOf(s.id) === -1; });
            if (n === 3 && Math.random() < 0.3) {
                var myth = pool.filter(function (s) { return s.redkost === 'mythic'; });
                if (myth.length) pool = myth;
            }
            if (pool.length) return { cost: cost, type: 'skin', skin: pool[Math.floor(Math.random() * pool.length)] };
            return { cost: cost, type: 'coins', cnt: cost };
        }
        var lo = n === 1 ? 3 : (n === 2 ? 10 : 25);
        var hi = n === 1 ? 8 : (n === 2 ? 20 : 50);
        var cnt = lo + Math.floor(Math.random() * (hi - lo + 1));
        return { cost: cost, type: 'coins', cnt: cnt };
    }

    function sozdatYablokiIBronyu() {
        yablokiNaArbuze = [];
        bronyaNaArbuze = [];
        bronyaProbytaNaUrovne = false;
        var ky = Math.floor(Math.random() * 3);
        for (var i = 0; i < ky; i++) {
            var p = 0, u;
            do { u = Math.random() * Math.PI * 2; p++; } while (!bezopasnyUgol(u, yablokiNaArbuze, 0.65) && p < 50);
            yablokiNaArbuze.push(u);
        }
        if (uroven >= 3) {
            var kb = 1 + Math.floor(uroven / 5);
            if (kb > 3) kb = 3;
            for (var j = 0; j < kb; j++) {
                var p2 = 0, u2;
                var z = yablokiNaArbuze.concat(bronyaNaArbuze);
                do { u2 = Math.random() * Math.PI * 2; p2++; } while (!bezopasnyUgol(u2, z, 0.65) && p2 < 50);
                bronyaNaArbuze.push(u2);
            }
        }
    }

    function bezopasnyUgol(nu, mz, md) {
        for (var i = 0; i < mz.length; i++) {
            var r = Math.abs(nu - mz[i]) % (Math.PI * 2);
            if (r > Math.PI) r = (Math.PI * 2) - r;
            if (r < md) return false;
        }
        return true;
    }

            kist.fill();
        }

        if ((sostoyanieIgry === 'PLAY' || sostoyanieIgry === 'GAMEOVER') && ostalosNozhei > 0 && padayushiyNozh === null && an) {
            kist.drawImage(an, nozh.x - nozh.shirina / 2, nozh.y, nozh.shirina, nozh.vysota);
        }

        if (padayushiyNozh && an) {
            if (!pauzaAktivna) {
                padayushiyNozh.vy += 0.8 * deltaTime * 60;
                padayushiyNozh.x += padayushiyNozh.vx * deltaTime * 60;
                padayushiyNozh.y += padayushiyNozh.vy * deltaTime * 60;
                padayushiyNozh.ugol += padayushiyNozh.vrashenie * deltaTime * 60;
            }
            kist.save();
            kist.translate(padayushiyNozh.x, padayushiyNozh.y);
            kist.rotate(padayushiyNozh.ugol);
            kist.drawImage(an, -nozh.shirina / 2, -nozh.vysota / 2, nozh.shirina, nozh.vysota);
            kist.restore();
        }

        for (var i6 = vsplyvayushieTeksty.length - 1; i6 >= 0; i6--) {
            var v = vsplyvayushieTeksty[i6];
            if (!pauzaAktivna) {
                v.y += v.vy * deltaTime * 60;
                v.zhizn -= 0.02 * deltaTime * 60;
            }
            if (v.zhizn > 0) {
                kist.globalAlpha = Math.max(0, v.zhizn);
                kist.fillStyle = v.cvet || '#FFD700';
                kist.font = 'bold 40px Arial';
                kist.textAlign = 'center';
                kist.fillText(v.text, v.x, v.y);
                kist.globalAlpha = 1;
            } else {
                vsplyvayushieTeksty.splice(i6, 1);
            }
        }
        kist.restore();

        kist.save();
        kist.scale(globalScale, globalScale);
        var vg = kist.createRadialGradient(200, 355, 170, 200, 355, 440);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.30)');
        kist.fillStyle = vg;
        kist.fillRect(0, 0, 400, 711);
        if (bannerEffekt) {
            bannerEffekt.t += deltaTime;
            var bt = bannerEffekt.t, bd = bannerEffekt.d;
            if (bt > bd) bannerEffekt = null;
            else {
                var pop = Math.min(1, bt * 7);
                var alB = bt > bd - 0.4 ? (bd - bt) / 0.4 : 1;
                kist.globalAlpha = Math.max(0, alB);
                kist.save();
                kist.translate(200, 240);
                kist.scale(0.6 + 0.4 * pop, 0.6 + 0.4 * pop);
                kist.font = 'bold 40px Arial';
                if (kist.measureText(bannerEffekt.text).width > 340) kist.font = 'bold 30px Arial';
                if (kist.measureText(bannerEffekt.text).width > 340) kist.font = 'bold 26px Arial';
                kist.textAlign = 'center';
                kist.lineWidth = 8; kist.strokeStyle = 'rgba(0,0,0,0.75)';
                kist.strokeText(bannerEffekt.text, 0, 0);
                kist.fillStyle = bannerEffekt.cvet;
                kist.fillText(bannerEffekt.text, 0, 0);
                if (bannerEffekt.text2) {
                    kist.font = 'bold 26px Arial';
                    kist.lineWidth = 6;
                    kist.strokeText(bannerEffekt.text2, 0, 42);
                    kist.fillStyle = '#FFD700';
                    kist.fillText(bannerEffekt.text2, 0, 42);
                }
                if (bannerEffekt.stars) {
                    kist.font = 'bold 34px Arial';
                    kist.lineWidth = 6;
                    kist.strokeText(bannerEffekt.stars, 0, 86);
                    kist.fillStyle = '#FFD700';
                    kist.fillText(bannerEffekt.stars, 0, 86);
                }
                kist.restore();
                kist.globalAlpha = 1;
            }
        }
        kist.restore();

        if (krasnayaVspyshka > 0) {
            kist.fillStyle = 'rgba(255,0,0,' + krasnayaVspyshka + ')';
            kist.fillRect(0, 0, holst.width, holst.height);
            krasnayaVspyshka -= 0.02 * deltaTime * 60;
        }
    }

    // =========================================================
    // CHEST SHOW — вскрытие сундука с анимацией
    // =========================================================
    var chestShowEl = null;
    var FX = {
        on: false, phase: '', n: 1, taps: 0, res: null, rar: 'coin', col: '#ffd76a',
        dur: 1500, minDur: 700, t0: 0, lastTick: 0, raf: 0,
        parts: [], dpr: 1, el: {}
    };
    var FX_COLS = { coin: '#ffd76a', common: '#b8c4d0', rare: '#4aa3ff', epic: '#b45cff', legendary: '#ff9a3c', mythic: '#ff4d6d' };
    var FX_CONF = ['#ffd76a', '#4aa3ff', '#b45cff', '#ff9a3c', '#ff4d6d', '#7dff8a', '#ffffff'];

    function fxShow() { return document.getElementById('chestShow'); }

    function fxResize() {
        var c = FX.el.canvas;
        if (!c) return;
        FX.dpr = Math.min(2, window.devicePixelRatio || 1);
        var w = window.innerWidth, h = window.innerHeight;
        c.width = Math.floor(w * FX.dpr);
        c.height = Math.floor(h * FX.dpr);
        c.style.width = w + 'px';
        c.style.height = h + 'px';
    }

    function emitSparks(n, inten) {
        var r = fxShow().getBoundingClientRect();
        var cx = r.width / 2, cy = r.height * 0.56;
        for (var i = 0; i < n; i++) {
            FX.parts.push({
                t: 'spark', x: cx + (Math.random() * 90 - 45) * (0.4 + inten), y: cy,
                vx: (Math.random() * 2 - 1) * 2.2, vy: -(1 + Math.random() * 2.6) * (0.6 + inten),
                g: 0.06, life: 1, dec: 0.02 + Math.random() * 0.02, col: FX.col, sz: 1 + Math.random() * 2
            });
        }
        if (FX.parts.length > 420) FX.parts.splice(0, FX.parts.length - 420);
    }

    function emitAt(x, y, n) {
        for (var i = 0; i < n; i++) {
            FX.parts.push({
                t: 'spark', x: x, y: y, vx: (Math.random() * 2 - 1) * 3, vy: -(Math.random() * 3),
                g: 0.08, life: 1, dec: 0.04, col: Math.random() < 0.7 ? FX.col : '#ffffff', sz: 1 + Math.random() * 2
            });
        }
    }

    function emitConfetti(n) {
        var r = fxShow().getBoundingClientRect();
        for (var i = 0; i < n; i++) {
            FX.parts.push({
                t: 'conf', x: Math.random() * r.width, y: -20 - Math.random() * r.height * 0.4,
                vx: (Math.random() * 2 - 1) * 1.2, vy: 1.5 + Math.random() * 2.5, g: 0.02,
                life: 1, dec: 0.004 + Math.random() * 0.004, rot: Math.random() * 6.28,
                vr: (Math.random() * 2 - 1) * 0.3, sz: 5 + Math.random() * 6,
                col: FX_CONF[i % FX_CONF.length]
            });
        }
    }

    function emitBurst() {
        var r = fxShow().getBoundingClientRect();
        var cx = r.width / 2, cy = r.height * 0.56;
        var n = 70 + (FX.rar === 'legendary' ? 40 : 0) + (FX.rar === 'mythic' ? 70 : 0);
        for (var i = 0; i < n; i++) {
            var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
            FX.parts.push({
                t: 'spark', x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, g: 0.09,
                life: 1, dec: 0.012 + Math.random() * 0.02, col: Math.random() < 0.5 ? FX.col : '#ffffff', sz: 1 + Math.random() * 2.5
            });
        }
        for (i = 0; i < 26; i++) {
            var a2 = Math.random() * Math.PI * 2, sp2 = 1.5 + Math.random() * 4;
            FX.parts.push({
                t: 'coin', x: cx, y: cy, vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2 - 4.5, g: 0.16,
                life: 1, dec: 0.008 + Math.random() * 0.008, rot: Math.random() * 6.28,
                vr: (Math.random() * 2 - 1) * 0.25, sz: 14 + Math.random() * 14
            });
        }
        if (FX.rar === 'epic' || FX.rar === 'legendary' || FX.rar === 'mythic') emitConfetti(60);
    }

    function drawParts(ctx) {
        for (var i = FX.parts.length - 1; i >= 0; i--) {
            var p = FX.parts[i];
            p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.dec;
            if (p.rot !== undefined) p.rot += p.vr;
            if (p.life <= 0 || p.y > window.innerHeight + 60) { FX.parts.splice(i, 1); continue; }
            ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
            if (p.t === 'coin') {
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
                if (kartinkaYabloko) ctx.drawImage(kartinkaYabloko, -p.sz / 2, -p.sz / 2, p.sz, p.sz);
                ctx.restore();
            } else if (p.t === 'conf') {
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
                ctx.fillStyle = p.col; ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2);
                ctx.restore();
            } else {
                ctx.fillStyle = p.col;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 6.2832); ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }

    function fxLoop(ts) {
        if (!FX.on) return;
        if (FX.phase === 'shake') {
            var el = ts - FX.t0;
            if (el - FX.lastTick > 75) {
                FX.lastTick = el;
                var inten = Math.min(1, el / FX.dur);
                playSnd('tap');
                var cw = FX.el.chest;
                if (cw) {
                    var j = 2 + inten * 8;
                    var tilt = (Math.random() * 2 - 1) * (1 + inten * 7);
                    cw.style.transform = 'translate(-50%,-50%) translate(' + ((Math.random() * 2 - 1) * j).toFixed(1) + 'px,' +
                        ((Math.random() * 2 - 1) * j).toFixed(1) + 'px) rotate(' + tilt.toFixed(1) + 'deg)';
                }
                emitSparks(2 + Math.floor(inten * 6), inten);
                if (FX.el.seam) FX.el.seam.style.opacity = (inten * 0.85).toFixed(2);
                if (FX.el.glow) FX.el.glow.style.opacity = (0.2 + inten * 0.8).toFixed(2);
            }
            if (el >= FX.dur) fxBurst();
        }
        var ctx = FX.el.ctx;
        if (ctx) {
            ctx.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            drawParts(ctx);
        }
        FX.raf = requestAnimationFrame(fxLoop);
    }

    function fxStart(n, res) {
        var show = fxShow();
        if (!show || FX.on) return;
        FX.on = true; FX.phase = 'shake'; FX.n = n; FX.res = res; FX.taps = 0;
        // награда начисляется сразу: закрытие вкладки посреди анимации не теряет лут
        if (res.type === 'skin') {
            kuplyennyeSkins.push(res.skin.id);
            stat.skinov = kuplyennyeSkins.length;
        } else {
            dobavitMonety(res.cnt);
        }
        saveData(); updateUI();
        FX.rar = res.type === 'skin' ? res.skin.redkost : 'coin';
        FX.col = FX_COLS[FX.rar] || FX_COLS.coin;
        show.style.setProperty('--fxcol', FX.col);
        show.className = 'on';
        FX.el.chest.className = n === 2 ? 'fx-tint-silver' : (n === 3 ? 'fx-tint-gold' : '');
        FX.el.chest.style.transform = 'translate(-50%,-50%)';
        FX.el.glow.style.opacity = 0;
        FX.el.seam.style.opacity = 0;
        FX.el.reward.className = '';
        FX.el.btns.style.opacity = 0;
        FX.el.btns.style.pointerEvents = 'none';
        FX.el.hint.innerText = t('fx_tap');
        fxResize();
        FX.parts = [];
        var base = 1500 + ({ rare: 200, epic: 450, legendary: 750, mythic: 950 }[FX.rar] || 0);
        FX.dur = base; FX.minDur = base * 0.45;
        FX.t0 = performance.now(); FX.lastTick = 0;
        playSnd('uiopen');
        FX.raf = requestAnimationFrame(fxLoop);
    }

    function fxBurst() {
        FX.phase = 'burst';
        var show = fxShow();
        show.classList.add('burst');
        show.classList.add('quake');
        setTimeout(function () { show.classList.remove('quake'); }, 480);
        if (FX.el.chest) FX.el.chest.style.transform = 'translate(-50%,-50%)';
        playSnd('uiopen');
        if (FX.rar === 'mythic' || FX.rar === 'legendary') playSnd('legendary');
        emitBurst();
        setTimeout(fxReveal, 300);
    }

    function countUp(cnt) {
        var t0 = performance.now();
        var dur = 800;
        var last = -1;
        var step = function (ts) {
            var el = Math.min(1, (ts - t0) / dur);
            var eased = 1 - Math.pow(1 - el, 3);
            var v = Math.round(cnt * eased);
            var node = document.getElementById('fxCnt');
            if (node && v !== last) {
                node.innerText = v;
                if (v > 0 && v % 4 === 0) playSnd('coinone');
                last = v;
            }
            if (el < 1) requestAnimationFrame(step);
            else playSnd('coinflow');
        };
        requestAnimationFrame(step);
    }

    function fxReveal() {
        FX.phase = 'reveal';
        var show = fxShow();
        show.classList.add('reveal');
        if (FX.rar === 'mythic') show.classList.add('mythic');
        var res = FX.res;
        if (!res) return;
        var img = FX.el.rewardImg, amt = FX.el.amt, rar = FX.el.rar, name = FX.el.name;
        if (res.type === 'skin') {
            var k = kartinkiOruzhiya[res.skin.id];
            img.style.width = '';
            img.src = k ? k.src : res.skin.file;
            amt.innerHTML = '';
            rar.className = 'redkostLabel rl-' + res.skin.redkost;
            rar.innerText = t('rar_' + res.skin.redkost);
            name.innerText = t(res.skin.id);
            name.style.color = FX.col;
        } else {
            img.src = kartinkaYabloko ? kartinkaYabloko.src : 'coin.png';
            img.style.width = 'min(120px, 30vw)';
            rar.className = '';
            rar.innerText = '';
            name.innerText = t('fx_coins');
            name.style.color = '#ffd76a';
            amt.innerHTML = coinIco() + ' × <span id="fxCnt">0</span>';
            countUp(res.cnt);
        }
        if (res.type === 'coins') playSnd('win');
        else if (FX.rar === 'mythic' || FX.rar === 'legendary') { playSnd('legendary'); playSnd('sparkle'); }
        else if (FX.rar === 'epic') { playSnd('sparkle'); playSnd('win'); }
        else { playSnd('win'); playSnd('sparkle'); }
        setTimeout(fxShowButtons, 650);
    }

    function fxShowButtons() {
        var btns = FX.el.btns;
        if (!btns) return;
        var res = FX.res;
        var cost = res ? res.cost : 6;
        var can = monety >= cost;
        FX.el.claim.innerText = t('claim');
        FX.el.again.innerHTML = t('fx_again') + ' (' + cost + ' ' + coinIco() + ')';
        FX.el.again.style.opacity = can ? 1 : 0.45;
        FX.el.again.disabled = !can;
        if (res && res.type === 'skin') {
            FX.el.equip.style.display = '';
            FX.el.equip.innerText = t('equip');
        } else {
            FX.el.equip.style.display = 'none';
        }
        // C1: после легендарного/мифического скина — ненавязчивая кнопка «похвастаться» (ведёт на knopkaShar.onclick)
        var brag = document.getElementById('fxBrag');
        if (!brag) {
            brag = document.createElement('button');
            brag.id = 'fxBrag';
            brag.className = 'knopka knopkaSharCvet';
            brag.onclick = function () { var ks = document.getElementById('knopkaShar'); if (ks && ks.onclick) ks.onclick(); };
            btns.appendChild(brag);
        }
        var showBrag = !!(res && res.type === 'skin' && (FX.rar === 'legendary' || FX.rar === 'mythic'));
        brag.style.display = showBrag ? '' : 'none';
        if (showBrag) brag.innerText = '📤 ' + t('b_share');
        btns.style.opacity = 1;
        btns.style.pointerEvents = 'auto';
    }

    function fxClose() {
        cancelAnimationFrame(FX.raf);
        FX.on = false; FX.phase = '';
        var show = fxShow();
        if (show) show.className = '';
        FX.parts = [];
        if (sostoyanieIgry === 'MENU') otrisovatMagazin();
    }

    function fxInit() {
        chestShowEl = fxShow();
        if (!chestShowEl) return;
        FX.el = {
            canvas: document.getElementById('fxCanvas'),
            rays: document.getElementById('fxRaysWrap'),
            glow: document.getElementById('fxGlow'),
            chest: document.getElementById('fxChestWrap'),
            lid: document.getElementById('fxLid'),
            body: document.getElementById('fxBody'),
            seam: document.getElementById('fxSeam'),
            reward: document.getElementById('fxReward'),
            rewardImg: document.getElementById('fxRewardImg'),
            amt: document.getElementById('fxAmt'),
            rar: document.getElementById('fxRar'),
            name: document.getElementById('fxName'),
            hint: document.getElementById('fxHint'),
            btns: document.getElementById('fxBtns'),
            again: document.getElementById('fxAgain'),
            equip: document.getElementById('fxEquip'),
            claim: document.getElementById('fxClaim')
        };
        FX.el.ctx = FX.el.canvas ? FX.el.canvas.getContext('2d') : null;
        fxResize();
        chestShowEl.addEventListener('pointerdown', function (e) {
            if (!FX.on || FX.phase !== 'shake') return;
            FX.dur = Math.max(FX.minDur, FX.dur - 140);
            playSnd('tap');
            var r = chestShowEl.getBoundingClientRect();
            emitAt(e.clientX - r.left, e.clientY - r.top, 4);
        });
        FX.el.claim.onclick = function () { fxClose(); };
        FX.el.equip.onclick = function () {
            if (FX.res && FX.res.type === 'skin') {
                window._game.vybratSkin(FX.res.skin.id);
                FX.el.equip.style.display = 'none';
            }
        };
        FX.el.again.onclick = function () {
            var n = FX.n;
            fxClose();
            window._game.chest(n);
        };
        window.addEventListener('resize', fxResize);
    }

    // =========================================================
    // ЗАПУСК
    // =========================================================
    function initGame() {
        fxInit();
        loadVkBridge(function () {
            PlatformAdapter.init().then(function () {
                currentLang = PlatformAdapter.getLanguage();
                applyLanguage();
                PlatformAdapter.signalReady();
                PlatformAdapter.preloadAds();
                nastroikaEkrana();
                loadDataFromAdapter();
                loadAudioFiles();

                PlatformAdapter.showPreroll(function () {
                    adLog('Preroll done');
                });

                setTimeout(finishLoading, 8000);
            });
        });
    }

    window.addEventListener('resize', forceResize);
    window.addEventListener('orientationchange', function () { setTimeout(forceResize, 100); });
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', forceResize);
        window.visualViewport.addEventListener('scroll', forceResize);
    }
    window.addEventListener('load', function () {
        setTimeout(forceResize, 100);
        setTimeout(forceResize, 500);
        setTimeout(forceResize, 1000);
        initGame();
    });





    nastroikaEkrana();
})();
</script>

        <img id="fxLid" src="chest.png" alt="">

        <div id="fxImgWrap"><div id="fxAura"></div><img id="fxRewardImg" src="" alt=""></div>

</div>
<div id="toastShar" class="toastShar"></div>
    <style>
        .toastShar { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,.8); color: #7cfc00; padding: 8px 16px; border-radius: 20px;
            font-size: 13px; opacity: 0; transition: all .3s; pointer-events: none; z-index: 99; }
        .toastShar.pokazat { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ================= CHEST SHOW ================= */
        #chestShow { display: none; position: fixed; inset: 0; z-index: 300; overflow: hidden;
            background: radial-gradient(circle at 50% 60%, rgba(46,32,14,.90), rgba(6,4,2,.97));
            -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
            touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        #chestShow.on { display: block; }
        #chestShow * { pointer-events: none; }
        #chestShow #fxBtns button { pointer-events: auto; }
        #fxCanvas { position: absolute; left: 0; top: 0; }
        #fxRaysWrap { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
        #fxRays { position: absolute; left: 0; top: 0; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax;
            background: repeating-conic-gradient(from 0deg, var(--fxcol, #ffd76a) 0deg 3deg, transparent 3deg 15deg);
            border-radius: 50%; mix-blend-mode: screen;
            -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%);
            mask-image: radial-gradient(circle, #000 0%, transparent 60%);
            animation: fxSpin 14s linear infinite; }
        @keyframes fxSpin { to { transform: rotate(360deg); } }
        #chestShow.burst #fxRaysWrap { animation: fxRaysIn 1.2s ease-out forwards; }
        @keyframes fxRaysIn { 0% { opacity: 0; transform: scale(.15); } 30% { opacity: .7; } 100% { opacity: .22; transform: scale(1); } }
        #fxGlow { position: absolute; left: 50%; top: 56%; width: min(340px, 70vw); height: min(340px, 70vw);
            transform: translate(-50%, -50%); border-radius: 50%; opacity: 0;
            background: radial-gradient(circle, var(--fxcol, #ffd76a) 0%, transparent 65%); filter: blur(6px); }
        #fxChestWrap { position: absolute; left: 50%; top: 56%; width: min(260px, 60vw); height: min(260px, 60vw);
            transform: translate(-50%, -50%); }
        #fxLid, #fxBody { position: absolute; left: 0; top: 0; width: 100%;
            transition: transform .75s cubic-bezier(.25,.7,.3,1), opacity .75s ease, filter .2s ease; }
        #fxLid { clip-path: inset(0 0 50% 0); }
